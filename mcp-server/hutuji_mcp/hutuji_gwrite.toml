# hutuji 写字机 gwrite profile（vpype-gcode）
# 契约来源：docs/protocol.md §5
#
# 本 profile 逐字对齐奎享雕刻（本硬件原配商业上位机）的真实产物，
# 证据是 kdraw 缓存目录里 9 份历史 G-code（2..10.gcode），9 份头尾/Z 行完全一致：
#   G21 / G90 / F8000
#   G1G90 Z0.0F10000     ← 开头连发两次，建立抬笔基准
#   G1G90 Z0.0F10000
#   G0 X..Y..F8000       ← 抬笔态空走到起点
#   G1G90 Z5.0F10000     ← 落笔
#   G1 X..Y..F8000       ← 画线，每行都带 F
#   G1G90 Z0.0F10000     ← 抬笔
#   G90G0 X0Y0           ← 奎享收尾回原点；**本项目禁用**（触发自动换纸）
# 全文 0 个 M 码：不用 M3/M5，笔控纯 Z 运动。
#
# 三条关键结论（2026-07-27 实机 + 逆向 + 真实产物三重确认）：
#   1. 不用 M3/M5：实测 Grbl 的 USE_M3_M5_AS_PEN_UP_DOWN 宏坐标报 Z=5 但笔不触纸，
#      直接 Z 运动才落笔；奎享跨 Grbl/Marlin 也都发 G1G90 Z。见 docs/kxnx/findings/01,02,06。
#   2. **不发 G92 Z0**：奎享靠"上电后弹簧把 Z 拉到物理原点 = 坐标 0 = 抬笔位"做机械自校准，
#      改坐标系反而会把基准带偏。开头两次 G1 Z0 是真实运动，不是坐标声明。
#      （逆向里的 G92 Z0 属于点动面板/连接路径，不进文件输出。）
#   3. 不依赖 $1（电机常使能）：奎享代码与配置里都没有 $1，弹簧回位方向就是抬笔方向，失能无害。
#
# 进给取值全部照抄奎享真实产物：画线/空走 F8000（133mm/s），抬落笔 F10000。
# Z 取值：Z=5 触纸落笔，Z=0 抬笔（对应奎享 zOn=2/zOff=0 经本机标定后的值，实机实测确认）。

[gwrite.hutuji]
unit = "mm"
vertical_flip = true
document_start = "G21\nG90\nF8000\nG1G90 Z0.0F10000\nG1G90 Z0.0F10000\n"
segment_first = "G0 X{x:.3f}Y{y:.3f}F8000\nG1G90 Z5.0F10000\n"
segment = "G1 X{x:.3f}Y{y:.3f}F8000\n"
line_end = "G1G90 Z0.0F10000\n"
# 收尾只抬笔：奎享的 G90G0 X0Y0 在本机固件会被判为换纸触发，禁止照抄。
document_end = "G1G90 Z0.0F10000\n"
info = "hutuji 写字机：逐字对齐奎享 Grbl 产物（G1G90 Z5.0 落笔 / Z0.0 抬笔，F8000/F10000，无 G92、无 M 码），A4 限幅 190x277mm"
