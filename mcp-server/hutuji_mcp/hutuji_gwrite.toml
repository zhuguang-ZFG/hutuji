# hutuji 写字机 gwrite profile（vpype-gcode）
# 契约来源：docs/protocol.md §5
#
# 本 profile 逐字对齐奎享雕刻（本硬件原配商业上位机）的真实产物，
# 证据是 kdraw 缓存目录里的 9 个文件（2..10.gcode）；它们 SHA256 完全相同，
# 因而只算 1 个唯一 G-code 产物的 9 个缓存副本。该唯一内容的头尾/Z 行为：
#   G21 / G90 / F8000
#   G1G90 Z0.0F10000     ← 开头连发两次，缓存兼容的幂等抬笔运动（**不建立 Z 基准**）
#   G1G90 Z0.0F10000
#   G0 X..Y..F8000       ← 抬笔态空走到起点
#   G1G90 Z5.0F10000     ← 落笔
#   G1 X..Y..F8000       ← 画线，每行都带 F
#   G1G90 Z0.0F10000     ← 抬笔
#   G90G0 X0Y0           ← 奎享收尾回原点；**本项目禁用**（触发自动换纸）
# 全文 0 个 M 码：不用 M3/M5，笔控纯 Z 运动。
#
# 当前生产结论（2026-07-29 实机复核）：
#   1. 不用 M3/M5：生产文件仍走直接 G1 Z；历史固件的 M3/M5 方向不能为当前固件背书。
#   2. 下载文件仍不含 G92，校验器继续拒绝 G92；完整会话由 S3 在每次首画/重画前
#      fresh Idle + 100ms 后旁路固定 `G92 Z0`，对齐奎享连接/首次笔控前的校准。
#   3. 本机 `$1=25`，空闲失能后弹簧回自然抬笔位。S3 使用 512 字节 character-counting
#      窗口持续填充 planner，避免笔画期间因 WiFi 往返空档失能。当前保持奎享原值
#      F10000，不采用未经证明的 F1000/F300 降速方案。2026-07-29 同文件中先画的
#      F300/F1500 线无墨，后画的 F10000/F1500 线出墨且均匀；落笔速度与先后顺序
#      尚未解耦，不能据此宣称 F10000 是唯一根因。详见 docs/troubleshooting.md。
#      画线 F8000 与落笔 F10000 的生产组合尚未在干净下载条件下取得纸面证据。
#      2026-07-30 手动 Telnet（G92 Z0 → Z5.0F10000 → G91 G1 X10.0 F800）纸面出墨；
#      出墨证据至今全部落在画线 ≤F1500，F8000 仍未验。改这里的 F 值前先读 $$，
#      并先跑一轮「画线保持 F8000 + 窗口化连续供料」的纸面测试。
#
# Z 取值：Z=5 触纸落笔，Z=0 抬笔；XY 画线/空走仍 F8000。

[gwrite.hutuji]
unit = "mm"
vertical_flip = true
document_start = "G21\nG90\nF8000\nG1G90 Z0.0F10000\nG1G90 Z0.0F10000\n"
segment_first = "G0 X{x:.3f}Y{y:.3f}F8000\nG1G90 Z5.0F10000\n"
segment = "G1 X{x:.3f}Y{y:.3f}F8000\n"
line_end = "G1G90 Z0.0F10000\n"
# 收尾只抬笔：奎享的 G90G0 X0Y0 在本机固件会被判为换纸触发，禁止照抄。
document_end = "G1G90 Z0.0F10000\n"
info = "hutuji 写字机：Z5 落笔/Z0 抬笔，Z/XY 均对齐奎享 F10000/F8000；S3 以 512 字节窗口保持连续执行；文件无 G92/M 码，A4 限幅 190x277mm"
