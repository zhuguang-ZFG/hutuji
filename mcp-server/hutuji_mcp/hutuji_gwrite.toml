# hutuji 写字机 gwrite profile（vpype-gcode）
# 契约来源：docs/protocol.md §5
#
# 本 profile 曾逐字对齐奎享雕刻（本硬件原配商业上位机）的真实产物，证据是
# kdraw 缓存目录里的 9 个文件（2..10.gcode）；它们 SHA256 完全相同，因而只算
# 1 个唯一 G-code 产物的 9 个缓存副本（F8000=133mm/s）。**2026-09-12 提速批
# （用户拍板「xy 轴提速 3 倍」）：XY 画线/空走 F8000 → F24000（400mm/s），
# 头/Z 行为仍逐字对齐奎享产物。** 改后的头尾/Z 行为：
#   G21 / G90 / F24000
#   G1G90 Z0.0F10000     ← 开头连发两次，缓存兼容的幂等抬笔运动（**不建立 Z 基准**）
#   G1G90 Z0.0F10000
#   G0 X..Y..F24000       ← 抬笔态空走到起点
#   G1G90 Z5.0F10000     ← 落笔
#   G1 X..Y..F24000       ← 画线，每行都带 F
#   G1G90 Z0.0F10000     ← 抬笔
#   G90G0 X0Y0           ← 奎享收尾回原点；**本项目禁用**（触发自动换纸）
# 全文 0 个 M 码：不用 M3/M5，笔控纯 Z 运动。
#
# 当前生产结论（2026-07-29 实机复核）：
#   1. 不用 M3/M5：生产文件仍走直接 G1 Z；历史固件的 M3/M5 方向不能为当前固件背书。
#   2. 下载文件仍不含 G92，校验器继续拒绝 G92；完整会话由 S3 在每次首画/重画前
#      fresh Idle + 100ms 后旁路固定 `G92 Z0`，对齐奎享连接/首次笔控前的校准。
#   3. 本机 `$1=25`，空闲失能后弹簧回自然抬笔位。S3 使用 512 字节 character-counting
#      窗口持续填充 planner，避免笔画期间因 WiFi 往返空档失能。当前保持奎享原值
#      F10000，不采用未经证明的 F1000/F300 降速方案。2026-07-29 同文件中先画的
#      F300/F1500 线无墨，后画的 F10000/F1500 线出墨且均匀；落笔速度与先后顺序
#      尚未解耦，不能据此宣称 F10000 是唯一根因。详见 docs/troubleshooting.md。
#      画线 F8000 出墨证据已于 2026-07-30 B-12 取得：S3 自动路径、生产组合
#      `Z5.0F10000` + `F8000`，五条长单段 + 三档密段共 8 条线经用户现场确认
#      完整连续（docs/release-readiness.md 第 3 项；此前本注释写「F8000 仍未验」
#      系未随 B-12 更新的过期陈述）。仍未验证的是**整体画质人工目视**（S4 玫瑰图
#      出墨连续性/曲线完整/断线），不是 F8000 出墨本身。
#      ⚠ 2026-09-12 提速批把画线提到 F24000（400mm/s）：出墨连续性**未在
#      400mm/s 重新取证**，B-12 证据只覆盖 133mm/s 档；纸面复验完成后回填本注
#      释。改这里的 F 值前先读 `$$` 并对账 readiness 既有证据。
#      2026-08-28：gwrite 之后 `gcode_gen._collapse_short_pen_down_segments` 把落笔态
#      G1 塌到 ≥1.0mm（末点保留），压 AI 描摹亚毫米链触发的 `$1` 空窗虚笔；不改本
#      profile 字面量。现场写字机另将 NVS `$1` 设为 255（常使能，用户纸面确认可画）；
#      与奎享默认 25 分叉，换板/`$RST=$` 须重设——非本 profile 职责。
#
# Z 取值：Z=5 触纸落笔，Z=0 抬笔；XY 画线/空走仍 F24000（2026-09-12 提速批）。

[gwrite.hutuji]
unit = "mm"
# 方向定案（2026-09-06 晚 B 案，supersede 当日下午的 flip=true 与 09-04 定案）：
# 用户拍板「不要横着写，要竖着写」——墙上竖装要站直横读。撰写页改竖版
# 190 宽 × 277 高（gcode_gen.PAGE_AUTHOR_*），本层保持 vertical_flip = false，
# 方向由 transpose_xy = true 接管：gcode_gen 在 G-code 层（塌缩后、弧拟合前）
# 逐行互换 X↔Y 词值，机器 X:=撰写 y、Y:=撰写 x。实机实测（当日下午 teach「上」
# 字页双 bit）：X+ 朝房间下、Y+ 朝房间右、原点墙面左上——转置后撰写 x→房间右
# （从左往右）、撰写 y→房间下（行序自上而下）、页左上角起笔落原点角，「从原点
# 开始从左往右写」三条用户诉求同时成立。gwrite 不认识 transpose_xy（未知键静默
# 忽略），纯供 gcode_gen 自读，方向配置集中本文件。历史：09-04 flip=false 定案
# （证据取自图画，朝向不可辨）→ 09-06 下午 flip=true 修真镜像 → 同日晚 B 案
# 竖版转置（用户拒受歪头阅读）。机器改摆放姿势则本定案作废，须重新取证。
vertical_flip = false
transpose_xy = true
document_start = "G21\nG90\nF24000\nG1G90 Z0.0F10000\nG1G90 Z0.0F10000\n"
segment_first = "G0 X{x:.3f}Y{y:.3f}F24000\nG1G90 Z5.0F10000\n"
segment = "G1 X{x:.3f}Y{y:.3f}F24000\n"
line_end = "G1G90 Z0.0F10000\n"
# 收尾只抬笔：奎享的 G90G0 X0Y0 在本机固件会被判为换纸触发，禁止进文件。
# 归位由 S3 在页尾以旁路 `G1G90 X0Y0F8000` 完成（G1 不触发换纸，2026-08-14
# 归位决策，docs/protocol.md §5），与本文件契约无关；S3 固件字面量不在本仓，
# 提速批未改它（归位仍是 133mm/s）。
document_end = "G1G90 Z0.0F10000\n"
info = "hutuji 写字机：Z5 落笔/Z0 抬笔，Z 恒 F10000；XY 画线/空走 F24000（2026-09-12 提速批，3×F8000；机器侧 $110/$111、$120/$121 同批配套改写，$$ 回读证据落 deployment.md）；S3 以 512 字节窗口保持连续执行；文件无 G92/M 码，A4 限幅 277x190mm（X=长边，2026-09-04 用户实机确认 X 长 Y 宽；$$ 配置值与物理轴角色相反，不进安全链）"
