<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151a">
  <title>呼图云 · 运营后台</title>
  <style>
    :root {
      color-scheme: dark;
      --bg0: #0c0f14;
      --bg1: #12151a;
      --card: #1a1f27;
      --card2: #232a34;
      --line: #3a4554;
      --text: #e8eef6;
      --muted: #93a0b2;
      --soft: #6b7789;
      --accent: #e8a87c;
      --accent-dark: #d4895a;
      --accent-soft: rgba(232, 168, 124, 0.14);
      --ok: #6fcf97;
      --ok-soft: rgba(111, 207, 151, 0.12);
      --err: #f97066;
      --err-soft: rgba(249, 112, 102, 0.12);
      --warn: #f5c26b;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      --radius: 16px;
      --tap: 48px;
      --font-display: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(900px 420px at 8% -10%, rgba(232, 168, 124, 0.12), transparent 70%),
        radial-gradient(700px 380px at 95% 0%, rgba(111, 207, 151, 0.08), transparent 65%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, var(--bg0));
      min-height: 100dvh;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        calc(1.25rem + env(safe-area-inset-bottom))
        env(safe-area-inset-left);
    }
    .hidden { display: none !important; }
    .shell { max-width: 1120px; margin: 0 auto; padding: 1rem; }

    .brand { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
    .logo {
      width: 46px; height: 46px; flex-shrink: 0;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #1a120c;
      font-family: var(--font-display);
      font-size: 1.25rem; font-weight: 700;
      display: grid; place-items: center;
      box-shadow: 0 10px 24px rgba(232, 168, 124, 0.28);
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 1.35rem;
      letter-spacing: 0.04em;
    }
    .brand p { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.82rem; }

    .card {
      background: var(--card);
      border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
      border-radius: var(--radius);
      padding: 1.1rem;
      margin-bottom: 0.9rem;
      box-shadow: var(--shadow);
    }

    .login-wrap {
      min-height: calc(100dvh - 2rem);
      display: grid;
      place-items: center;
    }
    .login-card { width: min(420px, 100%); }

    label.field { display: block; margin-bottom: 0.85rem; }
    label.field span {
      display: block;
      font-size: 0.84rem;
      font-weight: 650;
      margin-bottom: 0.35rem;
      color: var(--muted);
    }
    input[type=password], input[type=text], textarea {
      width: 100%;
      min-height: var(--tap);
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--bg1);
      color: var(--text);
      font: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    button {
      min-height: var(--tap);
      border: 0;
      border-radius: 13px;
      padding: 0.55rem 1rem;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
    }
    button:active { transform: scale(0.98); }
    button.primary {
      background: linear-gradient(145deg, var(--accent), var(--accent-dark));
      color: #1a120c;
    }
    button.secondary {
      background: var(--card2);
      color: var(--text);
      border: 1px solid var(--line);
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      min-height: 42px;
    }
    button.danger {
      background: var(--err-soft);
      color: var(--err);
      border: 1px solid color-mix(in srgb, var(--err) 35%, transparent);
    }
    button.block { width: 100%; }
    button.sm { min-height: 40px; padding: 0.4rem 0.75rem; font-size: 0.84rem; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin: -0.25rem -0.25rem 0.85rem;
      padding: 0.65rem 0.25rem;
      background: color-mix(in srgb, var(--bg1) 88%, transparent);
      backdrop-filter: blur(10px);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.65rem;
    }
    .stat {
      background: var(--bg1);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.85rem;
    }
    .stat span { display: block; font-size: 0.76rem; color: var(--muted); margin-bottom: 0.2rem; }
    .stat b { font-size: 1.35rem; letter-spacing: -0.02em; }

    .section-title {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 700;
    }
    .usage-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }
    .usage-chip {
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      background: var(--card2);
      border: 1px solid var(--line);
      font-size: 0.82rem;
      color: var(--muted);
    }
    .usage-chip b { color: var(--text); }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 650;
    }
    .tag.active { background: var(--ok-soft); color: var(--ok); }
    .tag.banned { background: var(--err-soft); color: var(--err); }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -0.25rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; min-width: 720px; }
    th, td {
      padding: 0.65rem 0.55rem;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }
    th {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--soft);
      background: var(--card2);
    }
    .row-actions { display: flex; flex-wrap: wrap; gap: 0.35rem; }

    .user-cards { display: none; flex-direction: column; gap: 0.75rem; }
    .user-card {
      background: var(--bg1);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0.9rem;
    }
    .user-card-head {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      align-items: flex-start;
      margin-bottom: 0.55rem;
    }
    .user-card-email {
      font-weight: 650;
      word-break: break-all;
      font-size: 0.92rem;
    }
    .user-card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.35rem 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.65rem;
    }
    .user-card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
    }

    .detail-panel { margin-top: 0.5rem; }
    pre.detail-json, pre.conv {
      background: var(--bg1);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.85rem;
      max-height: 280px;
      overflow: auto;
      font-size: 0.8rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .session-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.65rem 0;
    }
    .settings-grid {
      display: grid;
      gap: 0.85rem;
    }
    @media (min-width: 721px) {
      .settings-grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }
    .settings-block {
      border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
      border-radius: 12px;
      padding: 0.85rem;
      background: color-mix(in srgb, var(--card2) 70%, transparent);
    }
    .settings-block h3 {
      margin: 0 0 0.65rem;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .limit-row, .toggle-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.55rem;
      font-size: 0.88rem;
    }
    .limit-row input[type=number] {
      width: 5.5rem;
      min-height: 40px;
      text-align: right;
    }
    .hint-text {
      margin: 0.35rem 0 0;
      font-size: 0.78rem;
      color: var(--soft);
      line-height: 1.45;
    }
    .conv-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.65rem;
    }
    .empty-hint {
      color: var(--muted);
      font-size: 0.88rem;
      padding: 1rem 0;
      text-align: center;
    }

    .toast-stack {
      position: fixed;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: min(360px, calc(100vw - 2rem));
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      pointer-events: none;
    }
    .toast {
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: var(--card2);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 0.88rem;
      animation: toast-in 0.25s ease;
    }
    .toast.err { border-color: color-mix(in srgb, var(--err) 40%, transparent); color: var(--err); }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      .shell { padding: 0.75rem; }
      .table-wrap { display: none; }
      .user-cards { display: flex; }
      .user-card-actions .sm { min-height: 44px; }
      pre.detail-json, pre.conv { max-height: 40vh; }
    }

    @media (min-width: 721px) {
      .detail-panel {
        position: sticky;
        top: 4.5rem;
      }
    }
  </style>
</head>
<body>
<div class="toast-stack" id="toast-stack"></div>

<div class="shell">
  <section id="login-section">
    <div class="login-wrap">
      <div class="card login-card">
        <div class="brand" style="margin-bottom:1.25rem">
          <div class="logo">云</div>
          <div>
            <h1>呼图云运营后台</h1>
            <p>用户 · 对话 · 使用统计</p>
          </div>
        </div>
        <label class="field">
          <span>管理员密码</span>
          <input id="admin-password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </label>
        <button id="btn-admin-login" class="primary block">登录</button>
        <p id="login-msg" style="min-height:1.25rem;color:var(--err);font-size:.88rem;margin:.75rem 0 0"></p>
      </div>
    </div>
  </section>

  <section id="dash-section" class="hidden">
    <header class="topbar">
      <div class="brand">
        <div class="logo">云</div>
        <div>
          <h1 style="font-size:1.1rem">运营后台</h1>
          <p>呼图云</p>
        </div>
      </div>
      <button id="btn-admin-logout" class="ghost sm">退出</button>
    </header>

    <div class="card">
      <h2 class="section-title">数据概览</h2>
      <div id="stats" class="stats"></div>
      <h3 class="section-title" style="margin-top:1rem;font-size:.92rem;color:var(--muted)">近 7 天功能使用</h3>
      <div id="usage-7d" class="usage-chips"></div>
    </div>

    <div class="card">
      <h2 class="section-title">绘图服务设置</h2>
      <div class="settings-grid two-col">
        <div class="settings-block">
          <h3>生图 API 开关</h3>
          <div id="backend-toggles"></div>
          <p class="hint-text">仅控制是否参与并发对冲；API key 仍在服务器 <code>mcp.env</code> 中配置，此处不存凭据。</p>
          <button id="btn-save-backends" class="primary sm" style="margin-top:0.5rem">保存 API 开关</button>
        </div>
        <div class="settings-block">
          <h3>限流覆盖</h3>
          <div id="draw-limits-form"></div>
          <p class="hint-text" id="limits-hint">留空表示沿用 MCP 环境变量；保存后约 30 秒内生效。</p>
          <button id="btn-save-limits" class="primary sm" style="margin-top:0.5rem">保存限流</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="section-title">用户列表</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>邮箱</th><th>状态</th><th>绑机</th><th>传图</th><th>图库</th><th>操作</th></tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
      <div id="users-cards" class="user-cards"></div>
      <div id="users-empty" class="empty-hint hidden">暂无用户</div>
    </div>

    <div class="card detail-panel">
      <h2 class="section-title">用户详情 / 对话</h2>
      <pre id="detail" class="detail-json hidden"></pre>
      <div id="conv-toolbar" class="conv-toolbar hidden"></div>
      <div id="conv-sessions" class="session-row"></div>
      <pre id="conv-messages" class="conv hidden"></pre>
      <div id="detail-empty" class="empty-hint">选择用户「详情」或「对话」查看</div>
    </div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const STAT_LABELS = {
  users_total: "注册用户",
  users_active: "正常用户",
  users_banned: "已封禁",
  bindings_total: "已绑机",
  jobs_total: "传图任务",
  jobs_ready: "可发送",
  saved_total: "图库保存",
  conversation_events_total: "对话条数",
  usage_events_total: "功能埋点",
};

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("toast-stack").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function api(path, opts = {}) {
  const res = await fetch("/draw-admin/api" + path, {
    credentials: "same-origin",
    ...opts,
    headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || res.statusText);
  return data;
}

function tag(status) {
  return `<span class="tag ${status}">${status === "active" ? "正常" : status === "banned" ? "封禁" : status}</span>`;
}

function bindUserActions(root) {
  root.querySelectorAll("button[data-act]").forEach((btn) => {
    btn.onclick = () => handleUserAction(btn.dataset.id, btn.dataset.act);
  });
}

const LIMIT_LABELS = {
  draw_max_concurrent: "最大并发",
  draw_per_second: "每秒上限",
  draw_per_minute: "每分钟上限",
  vpype_max_concurrent: "vpype 并发",
};

let convUserId = null;

function downloadCsv(path) {
  window.location.href = "/draw-admin/api" + path;
}

async function loadDrawSettings() {
  const [limits, backends] = await Promise.all([
    api("/settings/draw-limits"),
    api("/settings/image-backends"),
  ]);
  const overrides = limits.overrides || {};
  const bounds = limits.bounds || {};
  $("draw-limits-form").innerHTML = (limits.keys || []).map((key) => {
    const b = bounds[key] || { min: 1, max: 999 };
    const val = overrides[key] ?? "";
    return `<label class="limit-row"><span>${LIMIT_LABELS[key] || key}</span>
      <input type="number" min="${b.min}" max="${b.max}" data-limit="${key}" value="${val}" placeholder="默认"></label>`;
  }).join("");
  if (limits.hint) $("limits-hint").textContent = limits.hint;
  const toggles = backends.toggles || {};
  const labels = backends.labels || {};
  $("backend-toggles").innerHTML = (backends.keys || []).map((key) =>
    `<label class="toggle-row"><span>${labels[key] || key}</span>
      <input type="checkbox" data-backend="${key}" ${toggles[key] !== false ? "checked" : ""}></label>`
  ).join("");
}

async function saveDrawLimits() {
  const body = {};
  $("draw-limits-form").querySelectorAll("input[data-limit]").forEach((el) => {
    const key = el.dataset.limit;
    const raw = el.value.trim();
    body[key] = raw === "" ? null : Number(raw);
  });
  await api("/settings/draw-limits", { method: "PUT", body: JSON.stringify(body) });
  toast("限流已保存");
  await loadDrawSettings();
}

async function saveImageBackends() {
  const body = {};
  $("backend-toggles").querySelectorAll("input[data-backend]").forEach((el) => {
    body[el.dataset.backend] = el.checked;
  });
  await api("/settings/image-backends", { method: "PUT", body: JSON.stringify(body) });
  toast("API 开关已保存");
  await loadDrawSettings();
}

function showConvToolbar(userId, sessionId) {
  convUserId = userId;
  const bar = $("conv-toolbar");
  bar.classList.remove("hidden");
  const sessionPart = sessionId
    ? `/export?session_id=${encodeURIComponent(sessionId)}`
    : "/export";
  bar.innerHTML = `
    <button class="secondary sm" type="button" id="btn-export-all">导出全部 CSV</button>
    ${sessionId ? `<button class="secondary sm" type="button" id="btn-export-session">导出当前会话 CSV</button>` : ""}`;
  $("btn-export-all").onclick = () => downloadCsv(`/users/${userId}/conversations/export`);
  const sessBtn = $("btn-export-session");
  if (sessBtn) {
    sessBtn.onclick = () => downloadCsv(`/users/${userId}/conversations/export?session_id=${encodeURIComponent(sessionId)}`);
  }
}

async function handleUserAction(id, act) {
  try {
    if (act === "detail") {
      const d = await api("/users/" + id);
      $("detail").textContent = JSON.stringify(d, null, 2);
      $("detail").classList.remove("hidden");
      $("detail-empty").classList.add("hidden");
      $("conv-sessions").innerHTML = "";
      $("conv-messages").classList.add("hidden");
      $("conv-toolbar").classList.add("hidden");
    } else if (act === "conv") {
      convUserId = id;
      const d = await api("/users/" + id + "/conversations");
      $("detail").classList.add("hidden");
      $("detail-empty").classList.add("hidden");
      $("conv-messages").classList.add("hidden");
      showConvToolbar(id, null);
      $("conv-sessions").innerHTML = (d.items || []).map((s) =>
        `<button class="secondary sm" data-uid="${id}" data-sid="${s.session_id}">${s.session_id.slice(0, 8)}… (${s.message_count}条)</button>`
      ).join("") || '<span class="empty-hint" style="padding:0">暂无采集对话（需固件上报且已绑机）</span>';
      $("conv-sessions").querySelectorAll("button[data-sid]").forEach((b) => {
        b.onclick = async () => {
          const m = await api("/users/" + b.dataset.uid + "/conversations/" + b.dataset.sid);
          $("conv-messages").classList.remove("hidden");
          showConvToolbar(b.dataset.uid, b.dataset.sid);
          $("conv-messages").textContent = (m.messages || []).map((x) => {
            const who = x.role === "user" ? "用户" : (x.role === "assistant" ? "小派" : x.role);
            return `[${who}] ${x.content}`;
          }).join("\n\n");
        };
      });
    } else if (act === "ban") {
      const reason = prompt("封禁原因") || "违规";
      await api("/users/" + id + "/ban", { method: "POST", body: JSON.stringify({ reason }) });
      toast("已封禁");
      await loadUsers();
    } else if (act === "unban") {
      await api("/users/" + id + "/unban", { method: "POST" });
      toast("已解封");
      await loadUsers();
    } else if (act === "unbind") {
      if (confirm("确认代客解绑？")) {
        await api("/users/" + id + "/unbind", { method: "POST" });
        toast("已解绑");
        await loadUsers();
      }
    }
  } catch (e) {
    toast(e.message, true);
  }
}

function renderUserRow(u) {
  const actions = `
    <button class="secondary sm" data-id="${u.id}" data-act="detail">详情</button>
    <button class="secondary sm" data-id="${u.id}" data-act="conv">对话</button>
    ${u.status === "banned"
      ? `<button class="secondary sm" data-id="${u.id}" data-act="unban">解封</button>`
      : `<button class="danger sm" data-id="${u.id}" data-act="ban">封禁</button>`}
    ${u.bound ? `<button class="secondary sm" data-id="${u.id}" data-act="unbind">解绑</button>` : ""}`;
  return `
    <tr>
      <td>${u.email}</td>
      <td>${tag(u.status)}</td>
      <td>${u.bound ? (u.device_mac || "是") : "否"}</td>
      <td>${u.job_count}</td>
      <td>${u.saved_count}</td>
      <td><div class="row-actions">${actions}</div></td>
    </tr>`;
}

function renderUserCard(u) {
  const actions = `
    <button class="secondary sm" data-id="${u.id}" data-act="detail">详情</button>
    <button class="secondary sm" data-id="${u.id}" data-act="conv">对话</button>
    ${u.status === "banned"
      ? `<button class="secondary sm" data-id="${u.id}" data-act="unban">解封</button>`
      : `<button class="danger sm" data-id="${u.id}" data-act="ban">封禁</button>`}
    ${u.bound ? `<button class="secondary sm" data-id="${u.id}" data-act="unbind">解绑</button>` : ""}`;
  return `
    <article class="user-card">
      <div class="user-card-head">
        <div class="user-card-email">${u.email}</div>
        ${tag(u.status)}
      </div>
      <div class="user-card-meta">
        <div>绑机：${u.bound ? (u.device_mac || "是") : "否"}</div>
        <div>传图：${u.job_count}</div>
        <div>图库：${u.saved_count}</div>
      </div>
      <div class="user-card-actions">${actions}</div>
    </article>`;
}

async function loadStats() {
  const s = await api("/stats");
  $("stats").innerHTML = Object.entries(s)
    .filter(([k]) => k !== "usage_7d")
    .filter(([, v]) => typeof v !== "object")
    .map(([k, v]) => `<div class="stat"><span>${STAT_LABELS[k] || k}</span><b>${v}</b></div>`)
    .join("");
  const usage = s.usage_7d || {};
  $("usage-7d").innerHTML = Object.keys(usage).length
    ? Object.entries(usage).map(([k, v]) => `<span class="usage-chip">${k}: <b>${v}</b></span>`).join("")
    : '<span class="usage-chip">暂无 usage（配置 ingest secret 后生效）</span>';
}

async function loadUsers() {
  const data = await api("/users");
  const items = data.items || [];
  $("users-empty").classList.toggle("hidden", items.length > 0);
  $("users-body").innerHTML = items.map(renderUserRow).join("");
  $("users-cards").innerHTML = items.map(renderUserCard).join("");
  bindUserActions($("users-body"));
  bindUserActions($("users-cards"));
}

async function enterDash() {
  $("login-section").classList.add("hidden");
  $("dash-section").classList.remove("hidden");
  await loadStats();
  await loadDrawSettings();
  await loadUsers();
}

$("btn-save-limits").onclick = () => saveDrawLimits().catch((e) => toast(e.message, true));
$("btn-save-backends").onclick = () => saveImageBackends().catch((e) => toast(e.message, true));

$("btn-admin-login").onclick = async () => {
  $("login-msg").textContent = "";
  const btn = $("btn-admin-login");
  btn.disabled = true;
  try {
    await api("/auth/login", { method: "POST", body: JSON.stringify({ password: $("admin-password").value }) });
    await enterDash();
  } catch (e) {
    $("login-msg").textContent = e.message;
  } finally {
    btn.disabled = false;
  }
};

$("btn-admin-logout").onclick = async () => {
  await api("/auth/logout", { method: "POST" });
  location.reload();
};

api("/stats").then(() => enterDash()).catch(() => {});
</script>
</body>
</html>
