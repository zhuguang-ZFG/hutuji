# draw-portal nginx 片段：并入 hutuji 443 server 块（阿里云主节点）。
# uvicorn 须带 --root-path /draw-upload（见 deploy/hutuji-draw-portal.service）
#
# 部署：复制进 /etc/nginx/conf.d/hutuji-gray.conf 的 server { } 内后
# nginx -t && systemctl reload nginx
# （若同时改 limit_req 的 key/zone，必须 restart nginx，见 deployment.md）

    location /draw-upload/ {
        limit_except GET HEAD POST PUT DELETE { deny all; }
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8302/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
