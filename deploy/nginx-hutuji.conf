# 京东云 nginx：只暴露 /files；证书路径上线时替换
# 安全组：放行 22（或改端口）/ 80 / 443；禁止放行 8300
#
# 注意：443 是「双入口」——`server_name` 同时含裸 IP 与隧道主机名，公网既可从
# Cloudflare Tunnel 也可直连 https://117.72.118.95 访问 /files。两条入口都受
# token 128-bit 保密与 /files 白名单保护，风险等价；若运维要求只走隧道，
# 需删掉裸 IP 的 server_name 并把安全组 443 仅对 Cloudflare 回源网段放行。
#
# 80 端口强制 301 跳转 HTTPS（G-code 明文传输可被中间人篡改机器指令）
# HUTUJI_PUBLIC_BASE_URL 必须配为 https://，S3 须信任自签证书或换正式证书

# Cloudflare Tunnel 的 TCP 回源恒为 loopback；直接用 $binary_remote_addr 会让全部公网
# 客户共享一个 10r/s 桶。CF-Connecting-IP 只在连接源是 loopback（cloudflared）时可信；
# 直连 :443 仍按连接源限速，不能让公网请求伪造该头绕过限速。头缺失时回退连接源，
# 避免 nginx 对空 key 不计数而静默关闭限速。
map $http_cf_connecting_ip $hutuji_cf_client_ip {
    "" $remote_addr;
    default $http_cf_connecting_ip;
}

map $remote_addr $hutuji_client_ip {
    default $remote_addr;
    127.0.0.1 $hutuji_cf_client_ip;
    ::1 $hutuji_cf_client_ip;
}

limit_req_zone $hutuji_client_ip zone=hutuji_files:10m rate=10r/s;
# 激活码中转：设备每激活一次只调一次，1r/s + burst 5 足够；新 zone 属
# limit_req 变更，按 2026-08-08 教训必须 systemctl restart nginx（reload 会静默丢弃）。
limit_req_zone $hutuji_client_ip zone=hutuji_register:10m rate=1r/s;
# 单 IP 并发连接上限（2026-09-07 补，findings/30 R3 要求 30 轮验收前落地）：
# keepalive 已放宽到 1800s 供设备多页复用，无连接数闸门时单 IP 可挂死全部
# worker 连接槽。注意 limit_conn 只统计「有在途请求」的连接，空闲 keepalive
# 不计数——它防的是并发长下载/慢请求占槽，空闲保活囤积仍由 keepalive_timeout
# 自身回收。20 的取值：单设备 1–2 连接、浏览器每主机 6 连接，3 倍以上余量；
# /files 与 /register 均为快请求。/draw-upload/ 是同步长请求（前端 150s
# AbortController），DrawLimiter 并发 8 之外请求排队仍在途计数，课堂 NAT
# 同 IP 30+ 学生并发生图会超过 20——该 location 单独放宽到 50。与 limit_req
# 同族：zone/key 变更 reload 会被静默丢弃，上线必须 systemctl restart nginx。
limit_conn_zone $hutuji_client_ip zone=hutuji_conn:10m;

# 同一身份同时用于限速、上游头与访问日志；保留 transport 源地址便于排查 Tunnel。
log_format hutuji_client '$hutuji_client_ip via=$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent"';

server {
    listen 443 ssl http2;
    # 不外泄精确版本号：默认 `on` 会让每个响应（含兜底 404）都带 nginx/1.x.y，
    # 等于给 CVE 库筛版本。此处只关本站两个 server 块，不动 http 级全局配置。
    server_tokens off;
    # 必须含隧道主机名：Cloudflare Tunnel 回源带 Host: hutuji.donglicao.com，
    # 只写 IP 会掉到 default server，/files 反代失效。
    server_name 117.72.118.95 hutuji.donglicao.com;
    access_log /var/log/nginx/hutuji-access.log hutuji_client;

    ssl_certificate     /etc/nginx/ssl/hutuji/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hutuji/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # TLS 连接复用（R6）：多页文章页间隔可达 20 分钟，默认 65s 空闲掐断会迫使设备
    # 每页重新握手——握手正是内部 SRAM 碎片化的主要 churn 源（2026-09-06 页 2 下载死亡）。
    keepalive_timeout 1800s;
    limit_conn hutuji_conn 20;

    # 2026-09-07 小程序「扫普通链接二维码打开小程序」规则校验文件（mp 后台签发，正文是
    # 32hex token，微信保存规则时回源核对；规则前缀 https://hutuji.donglicao.com/draw-upload/bind
    # → pages/bind/bind，根路径与前缀末级目录各放一份以兼容两种校验口径）。
    location = /G0ABDUIt0o.txt { return 200 "86fbf99399ada9ea7c7076172d5bfe46\n"; }
    location = /draw-upload/G0ABDUIt0o.txt { return 200 "86fbf99399ada9ea7c7076172d5bfe46\n"; }  # 官方指定目录（前缀去末段）
    location = /draw-upload/bind/G0ABDUIt0o.txt { return 200 "86fbf99399ada9ea7c7076172d5bfe46\n"; }

    location = /mcp { return 404; }
    location /mcp/ { return 404; }

    location /files/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hutuji_client_ip;
        proxy_set_header X-Forwarded-For $hutuji_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 歌曲文件（设备唱歌功能下载 OGG）：与 /files 同口径只放 GET/HEAD、
    # 共用 hutuji_files 限速桶；uvicorn 侧另有 ^[a-z0-9_-]{1,64}\.ogg$ 名字白名单。
    location /songs/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hutuji_client_ip;
        proxy_set_header X-Forwarded-For $hutuji_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 小派 OTA 固件静态仓（运营 publish_s3_firmware.py 产出 → scp 到 /var/hutuji/firmware/）
    location /firmware/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=10 nodelay;
        alias /var/hutuji/firmware/;
        # 大文件
        proxy_max_temp_file_size 0;
        sendfile on;
        default_type application/octet-stream;
    }

    # 激活码中转（设备 → 京东云 → 小智控制台代绑）：只放 POST，体上限 1k，
    # 上行 15s 足够（控制台境内）；失败由设备端屏显激活码人工兜底。
    location = /register {
        limit_except POST { deny all; }
        limit_req zone=hutuji_register burst=5 nodelay;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hutuji_client_ip;
        proxy_set_header X-Forwarded-For $hutuji_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location /draw-upload/ {
        limit_except GET HEAD POST PUT DELETE { deny all; }
        # 覆盖 server 级 20：同步长请求排队也在途计数，课堂 NAT 场景须放行（依据见顶部注释）
        limit_conn hutuji_conn 50;
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:8302/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}

server {
    # 显式 IPv4 监听：京东云 VPS 与 cloudflared 回源均为 IPv4 localhost；`:80`
    # 的 `allow ::1` 只是防 IPv6 回源误伤的多余保险，不打开 IPv6 监听面。
    listen 80;
    server_tokens off;
    server_name 117.72.118.95 hutuji.donglicao.com;
    access_log /var/log/nginx/hutuji-access.log hutuji_client;

    location = /mcp { return 404; }
    location /mcp/ { return 404; }

    # Cloudflare Tunnel 在边缘终结 TLS 后回源 http://localhost:80，故 :80 也必须
    # 能服务 /files/，否则公网经隧道下载会撞下方 301 自指坏环（S3 不跟随 301）。
    # 此段明文仅在 loopback 上流转，公网仍由 Cloudflare 边缘 TLS 保护。
    location /files/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hutuji_client_ip;
        proxy_set_header X-Forwarded-For $hutuji_client_ip;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 隧道回源的 /songs/：与 /files/ 同理，:80 不服务则公网经隧道下载歌曲
    # 会撞 301 自指坏环；同样只放 loopback。
    location /songs/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hutuji_client_ip;
        proxy_set_header X-Forwarded-For $hutuji_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 隧道回源的 /firmware/：静态 alias，与 :443 同目录；只许 loopback。
    location /firmware/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=10 nodelay;
        alias /var/hutuji/firmware/;
        proxy_max_temp_file_size 0;
        sendfile on;
        default_type application/octet-stream;
    }

    # 隧道回源（loopback）的 /register：与 /files 同口径只许本机，公网经
    # Cloudflare 边缘进来时 remote=127.0.0.1，故 allow loopback 即放行隧道。
    location = /register {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        limit_except POST { deny all; }
        limit_req zone=hutuji_register burst=5 nodelay;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hutuji_client_ip;
        proxy_set_header X-Forwarded-For $hutuji_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # G-code 明文传输可被中间人篡改机器指令，强制走 HTTPS。
    # 但**只对真正的明文请求**重定向：Cloudflare Tunnel 在边缘终结 TLS 后回源
    # `http://localhost:80`，隧道流量在这里一律是 `$scheme = http`，无条件 301 会把
    # 公网 HTTPS 请求打回同一个 URL → 又进隧道 → 又落本块，形成**自指死循环**：
    # 任意非 `/files/`、非 `/mcp` 的公网路径（`/docs`、`/redoc`、`/openapi.json`、
    # 随机路径）都拿到 301 而非 404，:443 块里的 `location / { return 404; }`
    # 隧道根本走不到（2026-08-07 实测 `curl -sL https://hutuji.donglicao.com/docs`
    # → `final=301 url=…/docs`，Location 指向自身）。隧道实测带
    # `X-Forwarded-Proto: https`，故用它区分「边缘已加密」与「真明文直连」。
    # 目标写字面量，不用 $host：两个 listen 都没写 default_server，一旦
    # sites-enabled/default 被删（deploy/README.md「清理旧环境」会诱发），本块即成
    # 事实上的 default server，任意 Host: 都落进来，$host 就是攻击者输入 —— 得到
    # 借本 VPS IP 信誉的开放重定向（curl -H 'Host: evil.com' → 301 https://evil.com/）。
    location / {
        # `if` + `return` 是 nginx 官方认可的安全用法（rewrite 模块两个例外之一）。
        if ($http_x_forwarded_proto = "https") { return 404; }
        return 301 https://hutuji.donglicao.com$request_uri;
    }
}
