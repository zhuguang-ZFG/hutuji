# 京东云 nginx：只暴露 /files；证书路径上线时替换
# 安全组：放行 22（或改端口）/ 80 / 443；禁止放行 8300
#
# 80 与 443 均提供 /files：自签证书阶段 S3 可用 http://IP/files/…
# （mcp.env 的 HUTUJI_PUBLIC_BASE_URL 联调期建议 http；有正式证后再改 https）

limit_req_zone $binary_remote_addr zone=hutuji_files:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name 117.72.118.95;

    ssl_certificate     /etc/nginx/ssl/hutuji/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hutuji/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /mcp { return 404; }
    location /mcp/ { return 404; }

    location /files/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name 117.72.118.95;

    location = /mcp { return 404; }
    location /mcp/ { return 404; }

    location /files/ {
        limit_except GET HEAD { deny all; }
        limit_req zone=hutuji_files burst=20 nodelay;
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
