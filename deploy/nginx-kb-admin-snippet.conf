# kb-admin nginx 片段：并入 hutuji 443 server 块（阿里云主节点）。
# 默认路径前缀 /kb-admin/（规格 §8 开放项默认）；子域方案见 kb-admin/README.md。
#
# root_path 约定：
#   - uvicorn 启动须带 --root-path /kb-admin（见 deploy/hutuji-kb-admin.service）
#   - 本 location 去掉 URI 前缀后反代到 loopback:8301 根路径
#   - 浏览器页面在 https://<host>/kb-admin/ ；后端仍见 /api/* 与 /
#
# 部署：复制进 /etc/nginx/... 后 nginx -t && systemctl reload nginx
# （若同时改 limit_req 的 key/zone，必须 restart nginx，见 deployment.md）
#
# 安全组仍禁止放行 8301；公网只经 nginx + 登录鉴权。

    location /kb-admin/ {
        limit_except GET HEAD POST PUT DELETE { deny all; }
        # 去掉 /kb-admin/ 前缀，转到 127.0.0.1:8301 根
        proxy_pass http://127.0.0.1:8301/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
